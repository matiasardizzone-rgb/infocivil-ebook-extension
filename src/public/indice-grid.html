<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Índice de actuaciones</title>
<style>
  body{font-family:Georgia,serif;max-width:1400px;margin:40px auto;padding:0 24px 60px;color:#1a1a2e;background:#faf8f3}
  h1{font-size:22px;line-height:1.3;margin-bottom:4px}
  .sub{color:#555;font-size:14px;margin-bottom:2px}
  .aviso{color:#555;font-size:11px;margin-bottom:24px}
  .lista{display:flex;flex-direction:column;gap:8px}
  .fila{
    border:1px solid #ddd6c5;background:#fff;border-radius:8px;padding:10px 16px;
    font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;gap:20px;
  }
  .info{flex:1;min-width:0;text-decoration:none;color:inherit;display:block;cursor:pointer}
  .info:hover .titulo{text-decoration:underline}
  .titulo{font-size:13.5px;font-weight:700;line-height:1.35;color:#1a1a2e}
  .detalle{font-size:12.5px;color:#444;line-height:1.4;margin-top:2px}
  .fecha{font-size:11px;color:#888;margin-top:4px}
  .botones{display:flex;gap:8px;flex-shrink:0}
  .botones button,.botones a{
    width:100px;text-align:center;font-size:12px;font-weight:600;padding:7px 0;border-radius:6px;
    border:1px solid #cfd8e8;background:#eef2f7;color:#00008c;text-decoration:none;cursor:pointer;
    font-family:inherit;box-sizing:border-box;
  }
  .botones button:hover,.botones a:hover{background:#dbe6f5}
  .botones button.copiado{background:#dff5e6!important;border-color:#9cd9b0!important;color:#0a6b2c!important}
</style>
</head>
<body>
  <h1 id="titulo"></h1>
  <div class="sub" id="sub"></div>
  <div class="aviso" id="aviso"></div>
  <div class="lista" id="grilla"></div>
  <script src="indice-grid.js"></script>
</body>
</html>
